name: Aggiorna Dashboard

on:
  schedule:
    # Orari italiani, anche al cambio fra ora solare e ora legale.
    # GitHub può ritardare o saltare le partenze programmate.
    - cron: '0 10,16 * * 1-5'
      timezone: Europe/Rome
    - cron: '30 13,14 * * 1-5'
      timezone: Europe/Rome
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aggiorna-dashboard
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          
      - name: Installa librerie
        run: python -m pip install -r requirements.txt

      - name: Verifica gestione errori e orari
        run: |
          python -m unittest discover -s tests -v
          node --test tests/dashboard.test.cjs
        
      - name: Estrai Orari e Crea Sito
        env:
          SOLARI_USER: ${{ secrets.SOLARI_USER }}
          SOLARI_PASS: ${{ secrets.SOLARI_PASS }}
          SOLARI_ID: ${{ secrets.SOLARI_ID }}
        run: python timbrature.py

      - name: Salva e pubblica su GitHub
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo "Nessun nuovo dato"
            exit 0
          fi
          git commit -m "Aggiornamento orari dashboard"
          git push
